  else if (tab === 'shops') body = `<section class="panel"><div class="ph"><div><h2>${L('Shop và kết nối nền tảng', 'Shops and platform connections')}</h2><p>${L('Mỗi shop thuộc một sàn. Dữ liệu lấy qua API của sàn, bổ sung bằng file nhập. Ngắt kết nối một sàn thì màn hình tự thu gọn theo các sàn còn lại.', 'Each shop belongs to one platform. Data comes through the platform API, topped up with import files. Disconnect a platform and the screens adapt to the platforms that remain.')}</p></div><button class="btn sm primary" data-act="shop-add">${ico('plus', 15)} ${L('Thêm shop', 'Add shop')}</button></div>${table([{ h: 'Shop' }, { h: L('Sàn', 'Platform') }, { h: L('Trạng thái shop', 'Shop status') }, { h: L('Kết nối', 'Connection') }, { h: L('Đồng bộ gần nhất', 'Last sync') }, { h: L('Đồng bộ', 'Sync') }, { h: '' }], SHOPS.map(s => [`<b>${esc(s.name)}</b>`, PLAT[s.plat].name, `<span class="row">${sw('shst-' + s.id, s.status === 'active', 'shop-st', `data-v="${s.id}"`)}<span class="note">${s.status === 'active' ? L('Hoạt động', 'Active') : L('Tạm dừng', 'Paused')}</span></span>`, s.connected ? chip(L('Đã kết nối', 'Connected'), 'ok') : chip(L('Chưa kết nối', 'Not connected'), 'warn'), s.connected ? s.lastSync : '—', s.sync === 'ok' ? chip(L('Ổn', 'OK'), 'ok') : chip(L('Lỗi', 'Error'), 'bad') + `<small>${esc(nm(s.err))}</small>`, `<span class="row"><button class="btn sm" data-act="shop-conn" data-v="${s.id}">${s.connected ? L('Ngắt kết nối', 'Disconnect') : L('Kết nối', 'Connect')}</button>${s.sync === 'error' && s.connected ? `<button class="btn sm primary" data-act="shop-fix" data-v="${s.id}">${L('Kết nối lại', 'Reconnect')}</button>` : ''}</span>`]))}<p class="note" style="margin-top:8px">${L('Bản thử: kết nối với sàn được giả lập.', 'Prototype: platform connections are mocked.')}</p></section>`;
  else if (tab === 'mem') {
    const members = USERS.filter(u => u.biz === biz.id);
    body = `<section class="panel"><div class="ph"><div><h2>${L('Thành viên và phân quyền', 'Members and permissions')}</h2><p>${L('Mỗi module có mức Xem hoặc Không có quyền. Mặc định User không có module nào. Thuế không bao giờ cấp cho User. Chỉ Admin sửa hoặc nhập dữ liệu.', 'Each module is View or No Access. By default a User has no module. Tax is never granted to a User. Only the Admin edits or enters data.')}</p></div><button class="btn sm primary" data-act="inv-user">${ico('plus', 15)} ${L('Mời User', 'Invite a User')}</button></div>${table([{ h: L('Tên', 'Name') }, { h: L('Vai trò', 'Role') }].concat(MODULES.filter(m => m !== 'tax').map(m => ({ h: modName(m) }))).concat([{ h: '' }]), members.map(u => [`<b>${esc(u.name)}</b><small>${esc(u.email)}</small>`, roleName(u)].concat(MODULES.filter(m => m !== 'tax').map(m => u.role === 'admin' ? chip(L('Xem + sửa', 'Full'), 'ok') : `<label class="sw"><input type="checkbox" ${u.mods.includes(m) ? 'checked' : ''} data-act="perm" data-v="${u.id}|${m}" aria-label="${esc(u.name + ' ' + modName(m))}"><i></i></label>`)).concat([u.role === 'admin' ? '' : `<button class="btn sm danger" data-act="rm-user" data-v="${u.id}">${L('Gỡ', 'Remove')}</button>`])))}</section>`;
  } else if (tab === 'int') body = `<section class="panel"><div class="ph"><div><h2>${L('Tích hợp', 'Integrations')}</h2><p>${L('Telegram nhận báo cáo theo lịch và cảnh báo quan trọng. Báo cáo vẫn được tạo trong app khi chưa kết nối.', 'Telegram receives scheduled reports and important alerts. Reports are still created in the app when it is not connected.')}</p></div></div><div class="panel" style="box-shadow:none"><div class="row sp"><div><b>Telegram</b><div class="note">${TG.connected ? L('Nơi nhận: ', 'Destination: ') + esc(TG.dest) : L('Chưa kết nối', 'Not connected')}</div></div>${TG.connected ? chip(L('Đã kết nối', 'Connected'), 'ok') : chip(L('Chưa kết nối', 'Not connected'), 'warn')}</div><ol class="note" style="padding-left:18px"><li>${L('Mở bot TopTop trên Telegram và bấm Start.', 'Open the TopTop bot in Telegram and tap Start.')}</li><li>${L('Thêm bot vào nhóm nhận báo cáo.', 'Add the bot to the group that receives reports.')}</li><li>${L('Dán mã liên kết trong bot vào ô bên dưới.', 'Paste the link code from the bot into the box below.')}</li></ol><div class="row">${!TG.connected ? '<input type="text" id="tg-code" placeholder="TT-XXXX-XXXX" aria-label="Link code">' : ''}<button class="btn" data-act="tg-test">${L('Kiểm tra kết nối', 'Test connection')}</button><button class="btn ${TG.connected ? 'danger' : 'primary'}" data-act="tg-toggle">${TG.connected ? L('Ngắt kết nối', 'Disconnect') : L('Kết nối', 'Connect')}</button></div></div></section>`;
  else if (tab === 'thr') body = `<section class="panel"><h2>${L('Ngưỡng và giá trị bạn tự đặt', 'Limits and values you set')}</h2><p class="note">${L('App chỉ dùng các giá trị này để cảnh báo. Bạn đổi lúc nào cũng được.', 'The app only uses these values to alert you. Change them any time.')}</p><div class="form">${[['payDays', L('Xem trước hóa đơn nhà cung cấp (ngày)', 'Supplier invoices shown ahead (days)')], ['dropPct', L('Doanh thu giảm so với kỳ trước (%)', 'Revenue drop against the previous period (%)')], ['returnPct', L('Tỷ lệ hủy hoặc hoàn tối đa (%)', 'Maximum cancel or return rate (%)')], ['marginTarget', L('Mục tiêu biên lợi nhuận (%)', 'Profit margin target (%)')], ['expiryDays', L('Cảnh báo lô còn dưới (ngày)', 'Warn when a lot has fewer days than')], ['safetyDays', L('Tồn kho an toàn (ngày bán)', 'Safety stock (days of sales)')], ['quota', L('Số câu hỏi AI mỗi ngày', 'AI questions per day')]].map(f => field(f[1], `<input type="number" id="th-${f[0]}" min="0" value="${SETTINGS[f[0]]}">`, 'th-' + f[0])).join('')}</div><div class="row"><button class="btn primary" data-act="th-save">${L('Lưu', 'Save')}</button></div></section>`;
  else body = importPanel();
  return `<div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" aria-selected="${tab === t[0]}" data-act="pftab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
};
function importPanel() {
  const f = ST.tab.impf;
  const prev = f ? `<div class="stack"><div class="row sp"><b>${esc(f.name)}</b>${chip(f.type ? L('Nhận biết: ', 'Detected: ') + f.type : L('Chưa nhận biết loại file', 'Type not recognised'), f.type ? 'ok' : 'warn')}</div>${f.errs.length ? `<div class="al high"><div class="b"><b>${L('Cần sửa trước khi nhập', 'Fix before importing')}</b>${f.errs.map(e => `<span>${esc(e)}</span>`).join('<br>')}</div></div>` : `<p class="note">${L('Thiếu cột bắt buộc: không có. ', 'Missing required columns: none. ')}${f.rows.length - 1} ${L('dòng sẵn sàng.', 'rows ready.')}</p>`}${table(f.rows[0].map(h => ({ h: esc(h) })), f.rows.slice(1, 6).map(r => r.map(c => esc(c))))}<div class="row"><button class="btn primary" data-act="imp-go" ${f.errs.length || !f.type ? 'disabled' : ''}>${L('Nhập dữ liệu', 'Import')}</button><button class="btn" data-act="imp-clear">${L('Bỏ file', 'Remove file')}</button></div></div>` : '';
  return `<section class="panel"><div class="ph"><div><h2>${L('Nhập dữ liệu', 'Data import')}</h2><p>${L('File CSV bổ sung những gì API không cung cấp. Nhập lại cùng một file không tạo dòng trùng: dòng cũ chỉ được cập nhật.', 'CSV files fill what the API does not provide. Importing the same file again never duplicates rows: existing rows are only updated.')}</p></div><button class="btn sm" data-act="imp-sample">${ico('dl', 15)} ${L('Tải file mẫu', 'Download a sample file')}</button></div><div class="row"><label class="btn" for="imp-file">${L('Chọn file .csv', 'Choose a .csv file')}</label><input type="file" id="imp-file" accept=".csv" class="sr" style="position:absolute;left:-9999px" data-chg="impfile"><span class="note">${L('Nhận biết loại file từ tiêu đề cột: đơn hàng, sản phẩm, quảng cáo, hóa đơn nhà cung cấp.', 'The type is detected from the column headers: orders, products, ads, supplier invoices.')}</span></div>${prev}</section><section class="panel"><h2>${L('Lịch sử nhập', 'Import history')}</h2>${table([{ h: L('Lúc', 'When') }, { h: L('Loại', 'Source') }, { h: 'File' }, { h: L('Dòng', 'Rows'), r: 1 }, { h: L('Mới / cập nhật / không đổi', 'New / updated / unchanged'), r: 1 }, { h: L('Người nhập', 'By') }], IMPORTS.map(i => [i.at, i.src, esc(i.file), i.rows, `${i.n} / ${i.u} / ${i.k}`, esc(i.by)]))}</section>`;
}
const IMP_TYPES = [{ n: ['order id', 'sku'], t: 'Orders', tv: 'Đơn hàng', need: ['order id', 'date', 'sku', 'quantity', 'amount'] }, { n: ['sku', 'cost'], t: 'Product catalog', tv: 'Danh mục sản phẩm', need: ['sku', 'name', 'cost'] }, { n: ['campaign', 'spend'], t: 'Ads spend', tv: 'Chi phí quảng cáo', need: ['date', 'campaign', 'spend'] }, { n: ['invoice', 'due'], t: 'Supplier invoices', tv: 'Hóa đơn nhà cung cấp', need: ['invoice', 'supplier', 'amount', 'due'] }];
function parseCsv(t) { const rows = []; let r = [], c = '', q = false; for (let i = 0; i < t.length; i++) { const ch = t[i]; if (q) { if (ch === '"' && t[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; } else if (ch === '"') q = true; else if (ch === ',') { r.push(c); c = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); c = ''; if (r.some(x => x !== '')) rows.push(r); r = []; } else c += ch; } r.push(c); if (r.some(x => x !== '')) rows.push(r); return rows; }
CHG.impfile = async el => { const file = el.files[0]; if (!file) return; if (!/\.csv$/i.test(file.name)) { ST.tab.impf = { name: file.name, type: null, errs: [L('Chọn file .csv.', 'Choose a .csv file.')], rows: [[]] }; render(); return; } const txt = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).replace(/^﻿/, '')); fr.onerror = () => res(null); fr.readAsText(file, 'utf-8'); }); if (txt == null) { toast(L('Không đọc được file.', 'The file could not be read.')); return; } const rows = parseCsv(txt), head = (rows[0] || []).map(h => norm(h).trim()), ty = IMP_TYPES.find(t => t.n.every(k => head.some(h => h.includes(k)))); const errs = []; if (ty) { ty.need.forEach(k => { if (!head.some(h => h.includes(k))) errs.push(L('Thiếu cột bắt buộc: ', 'Missing required column: ') + k); }); } else errs.push(L('Không nhận biết được loại file từ tiêu đề cột.', 'The file type could not be detected from the column headers.')); if (rows.length < 2) errs.push(L('File không có dòng dữ liệu.', 'The file has no data rows.')); ST.tab.impf = { name: file.name, type: ty ? L(ty.tv, ty.t) : null, errs, rows: rows.length ? rows : [[]] }; render(); };
ACT['imp-go'] = () => { const f = ST.tab.impf, n = f.rows.length - 1, nn = Math.round(n * .6), u = Math.round(n * .15); IMPORTS.unshift({ at: TODAY + ' 10:50', src: f.type, file: f.name, rows: n, n: nn, u, k: n - nn - u, by: me().email }); ST.tab.impf = null; toast(L('Đã nhập ' + n + ' dòng. Bản thử chỉ ghi vào lịch sử.', 'Imported ' + n + ' rows. The prototype only records it in the history.')); render(); };
ACT['imp-clear'] = () => { ST.tab.impf = null; render(); };
ACT['imp-sample'] = () => saveBlob('toptop-mau-don-hang.csv', new Blob(['﻿Order ID,Date,SKU,Quantity,Amount,Status\n576411230000001,2026-11-22,TRA-SHAN-100,2,370000,Completed\n576411230000002,2026-11-22,CAFE-RANG-250,1,129000,Shipping\n'], { type: 'text/csv;charset=utf-8' }));
ACT.pftab = el => { ST.tab.pf = el.dataset.v; render(); };
ACT['bz-save'] = () => { const n = $('#bz-name').value.trim(); if (!n) { toast(L('Nhập tên Business.', 'Enter the Business name.')); return; } myBiz().name = n; BUSINESS_INFO.info = $('#bz-info').value; toast(L('Đã lưu cài đặt Business.', 'Business settings saved.')); render(); };
ACT['shop-st'] = el => { SBY[el.dataset.v].status = el.checked ? 'active' : 'paused'; fixFilters(); bump(); render(); };
function fixFilters() { if (ST.platform !== 'all' && !livePlats().includes(ST.platform)) { ST.platform = 'all'; ST.shop = 'all'; } if (ST.shop !== 'all' && !liveShop(ST.shop)) ST.shop = 'all'; }
ACT['shop-conn'] = el => { const s = SBY[el.dataset.v]; s.connected = !s.connected; if (s.connected) { s.lastSync = TODAY + ' 10:55'; s.sync = 'ok'; s.err = ''; } fixFilters(); bump(); toast(s.connected ? L('Đã kết nối ', 'Connected ') + s.name : L('Đã ngắt kết nối ', 'Disconnected ') + s.name); render(); };
ACT['shop-fix'] = el => { const s = SBY[el.dataset.v]; s.sync = 'ok'; s.err = ''; s.lastSync = TODAY + ' 10:55'; bump(); toast(L('Đã kết nối lại ', 'Reconnected ') + s.name); render(); };
ACT['shop-add'] = () => modal(`<div class="row sp"><h2>${L('Thêm shop', 'Add a shop')}</h2>${closeBtn()}</div><div class="form">${field(L('Tên shop', 'Shop name'), '<input type="text" id="sa-name">', 'sa-name')}${field(L('Sàn', 'Platform'), `<select id="sa-plat"><option value="tiktok">TikTok Shop</option><option value="shopee">Shopee</option></select>`, 'sa-plat')}</div><div class="row"><button class="btn primary" data-act="shop-add-go">${L('Thêm và kết nối', 'Add and connect')}</button></div>`);
ACT['shop-add-go'] = () => { const n = $('#sa-name').value.trim(); if (!n) { toast(L('Nhập tên shop.', 'Enter the shop name.')); return; } const s = { id: 'S' + (SHOPS.length + 1), plat: $('#sa-plat').value, name: n, connected: true, status: 'active', lastSync: TODAY + ' 10:55', sync: 'ok', err: '' }; SHOPS.push(s); SBY[s.id] = s; bump(); closeOverlay(); toast(L('Đã thêm shop. Chưa có đơn nào vì vừa kết nối.', 'Shop added. No orders yet because it was just connected.')); render(); };
ACT.perm = el => { const [uid, m] = el.dataset.v.split('|'), u = USERS.find(x => x.id === uid); if (el.checked) { if (!u.mods.includes(m)) u.mods.push(m); } else u.mods = u.mods.filter(x => x !== m); toast(L('Đã cập nhật quyền của ', 'Updated access for ') + u.name); };
ACT['rm-user'] = el => { const u = USERS.find(x => x.id === el.dataset.v); u.biz = null; u.mods = []; u.status = 'pending'; const b = myBiz(); b.members = b.members.filter(x => x !== u.id); AUTO.forEach(a => { a.to = a.to.filter(x => x !== u.id); }); toast(L('Đã gỡ ', 'Removed ') + u.name); render(); };
ACT['inv-user'] = () => modal(`<div class="row sp"><h2>${L('Mời User', 'Invite a User')}</h2>${closeBtn()}</div><p class="note">${L('Mời bằng email Google. User mới chưa có module nào; bạn cấp từng module sau.', 'Invite by Google email. A new User has no module; you grant them one by one afterwards.')}</p><div class="form">${field(L('Tên', 'Name'), '<input type="text" id="iu-name">', 'iu-name')}${field('Email Google', '<input type="email" id="iu-mail">', 'iu-mail')}</div><div class="row"><button class="btn primary" data-act="inv-user-go">${L('Gửi lời mời', 'Send invite')}</button></div>`);
ACT['inv-user-go'] = () => { const n = $('#iu-name').value.trim(), e = $('#iu-mail').value.trim(); if (!n || !/.+@.+/.test(e)) { toast(L('Nhập tên và email hợp lệ.', 'Enter a name and a valid email.')); return; } const u = { id: 'U-' + Date.now(), name: n, email: e, role: 'user', status: 'active', biz: myBiz().id, mods: [], desc: { vi: 'Được mời bởi Admin', en: 'Invited by the Admin' } }; USERS.push(u); myBiz().members.push(u.id); closeOverlay(); toast(L('Đã mời ', 'Invited ') + n); render(); };
ACT['tg-test'] = () => toast(TG.connected ? L('Kết nối Telegram ổn (giả lập).', 'Telegram connection is fine (mocked).') : L('Chưa kết nối Telegram.', 'Telegram is not connected.'));
ACT['tg-toggle'] = () => { if (TG.connected) { TG.connected = false; Object.values(SCHED).forEach(s => s.tg = false); toast(L('Đã ngắt Telegram. Báo cáo vẫn được tạo trong app.', 'Telegram disconnected. Reports are still created in the app.')); } else { const c = $('#tg-code'); if (!c || !/^TT-/i.test(c.value.trim())) { toast(L('Nhập mã liên kết dạng TT-XXXX-XXXX.', 'Enter a link code like TT-XXXX-XXXX.')); return; } TG.connected = true; TG.dest = '@mocmac_baocao (nhóm Telegram)'; toast(L('Đã kết nối Telegram (giả lập).', 'Telegram connected (mocked).')); } render(); };
ACT['th-save'] = () => { const ks = ['payDays', 'dropPct', 'returnPct', 'marginTarget', 'expiryDays', 'safetyDays', 'quota'], vals = ks.map(k => +$('#th-' + k).value); if (vals.some(v => isNaN(v) || v < 0) || vals[0] < 1 || vals[6] < 1) { toast(L('Nhập số hợp lệ (ngày và hạn mức ít nhất 1).', 'Enter valid numbers (days and quota at least 1).')); return; } ks.forEach((k, i) => { SETTINGS[k] = vals[i]; }); bump(); toast(L('Đã lưu ngưỡng.', 'Limits saved.')); render(); };

(function init() {
  const l = store.get('tt-lang'); if (l === 'vi' || l === 'en') ST.lang = l; const t = store.get('tt-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  const dv = store.get('tt-dev'); if (dv === 'tablet' || dv === 'mobile') ST.dev = dv;
  render();
})();

</script>


</body></html>
